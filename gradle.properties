org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
android.nonTransitiveRClass=true
# Compose Multiplatform iOS targets are only enabled on a macOS host with this flag.
coffeejournal.enableIos=false
kotlin.native.ignoreDisabledTargets=true
# lets a Linux machine compile the iOS code to klibs (coffeejournal.iosKlibs=true); linking the app still needs a Mac
kotlin.native.enableKlibsCrossCompilation=true
kotlin.mpp.androidSourceSetLayoutVersion=2
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=1000
org.gradle.workers.max=2
