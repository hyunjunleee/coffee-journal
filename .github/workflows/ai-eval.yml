# PoC for the AI note helper (docs/ai-note-helper-plan.md, tools/ai-eval/): asks Gemini with Google Search grounding
# the app's two kinds of questions and reports how well the answers are tied to real sources.
#
# Repository secret (Settings › Secrets and variables › Actions):
#   GEMINI_API_KEY_DEBUG   a free Gemini API key for development only (a project without billing). It is never put
#                          into the app: in the app every user enters their own key (docs/ai-note-helper-plan.md §5).
# Without it only the parser self-test runs. The report goes to a short-lived artifact (7 days) and the job summary;
# grounded answers are not committed to the repository.
name: AI note helper eval

on:
  push:
    branches: ['claude/**']
    paths: ['tools/ai-eval/**', '.github/workflows/ai-eval.yml']
  workflow_dispatch:
    inputs:
      probe:
        description: >-
          Comma-separated models to probe (one short question each, without and with Google Search). Leave empty
          to run the full evaluation with the model below.
        default: gemini-2.5-flash-lite,gemini-2.5-pro,gemini-3.8-flash,gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite
      model:
        description: Gemini model for the full evaluation
        default: gemini-3.8-flash
      notes:
        description: How many notes to explain (mode A, up to 20)
        default: '12'
      describes:
        description: How many taste descriptions to match to notes (mode B, up to 8)
        default: '6'

permissions:
  contents: read

concurrency:
  group: ai-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Self-test the response parsing
        run: python3 tools/ai-eval/eval.py --selftest

      - name: Ask Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_DEBUG }}
          # a push only probes the models; the full evaluation is started by hand once a model is known to work
          PROBE: ${{ github.event_name == 'push' && 'gemini-2.5-flash-lite,gemini-2.5-pro,gemini-3.8-flash,gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite' || inputs.probe }}
          MODEL: ${{ inputs.model || 'gemini-3.8-flash' }}
          NOTES: ${{ inputs.notes || '12' }}
          DESCRIBES: ${{ inputs.describes || '6' }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::The GEMINI_API_KEY_DEBUG secret is not set; only the self-test ran."
            exit 0
          fi
          if [ -n "$PROBE" ]; then
            python3 tools/ai-eval/eval.py --probe "$PROBE" --out ai-eval-out
          else
            python3 tools/ai-eval/eval.py --model "$MODEL" --notes "$NOTES" --describes "$DESCRIBES" --out ai-eval-out
          fi
          # the summary part of the report (before the answers) on the run page
          sed '/^## Answers/,$d' ai-eval-out/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always() && hashFiles('ai-eval-out/report.md') != ''
        uses: actions/upload-artifact@v6
        with:
          name: ai-eval-report
          path: ai-eval-out/
          retention-days: 7
